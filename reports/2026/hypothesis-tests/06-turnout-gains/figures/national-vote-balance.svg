  <g id="text_23">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #515c65" transform="translate(40.773438 435.4796)">Totais de todas as seções dos CSVs originais, incluindo exterior; não se restringem à coorte formal.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #515c65" transform="translate(40.773438 445.405741)">Balanço de contagens, não transferência de pessoas. Entradas e saídas de votantes podem ocorrer simultaneamente.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #515c65" transform="translate(40.773438 455.0976)">Votos não nominais: brancos, nulos, legenda e separados, conforme categorias dos arquivos.</text>
  </g>
