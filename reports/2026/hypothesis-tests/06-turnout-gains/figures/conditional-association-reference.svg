  </g>
  <g id="text_20">
   <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #515c65" transform="translate(150.271563 432.667912)">Módulos observados: 0,0184 a 0,0319; significância não implica associação forte.</text>
   <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #515c65" transform="translate(150.271563 442.477275)">ρ é exibida com sinal nas anotações: positivo associa maior comparecimento a maior mudança relativa para Lula; negativo, para Flávio.</text>
   <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #515c65" transform="translate(150.271563 452.286637)">4.999 permutações por referência; pH: Holm na família de quatro testes. Faixas simuladas não são intervalos de confiança.</text>
   <text style="font-size: 8.4px; font-family: 'DejaVu Sans'; fill: #515c65" transform="translate(150.271563 462.096)">A referência testa independência condicional; mobilização legítima e características não observadas também podem produzir associação.</text>
  </g>
