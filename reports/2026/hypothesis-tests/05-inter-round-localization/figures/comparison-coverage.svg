   <g id="text_22">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #263238" x="521.671818" y="56.04" transform="rotate(-0 521.671818 56.04)">Referência formal: alvos e trocas possíveis</text>
   </g>
  </g>
  <g id="text_23">
   <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #263238" x="69.25" y="19.63" transform="rotate(-0 69.25 19.63)">Onde a comparação tem suporte?</text>
  </g>
  <g id="text_24">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #515c65" transform="translate(69.25 452.169859)">Coberturas são recortes da mesma coorte e não devem ser somadas. A preferência inicial usa faixas de cinco pontos percentuais.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #515c65" transform="translate(69.25 462.096)">Sem suporte na triagem, não se classifica a seção como normal ou anômala. Na referência formal, potencial de troca não garante variação de todo escore.</text>
  </g>
  <g id="legend_1">
