  <g id="text_22">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #515c65" transform="translate(167.789219 407.640594)">4.999 permutações por referência; pH: Holm na família fixa de quatro testes. As faixas não são intervalos de confiança.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #515c65" transform="translate(167.789219 417.332453)">Os pares e a distribuição de mudanças são preservados. O teste examina sua alocação entre locais, sem provar causa artificial.</text>
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #515c65" transform="translate(167.789219 427.104)">MAX não é um escore-z nem um teste individual de seção ou local.</text>
  </g>
